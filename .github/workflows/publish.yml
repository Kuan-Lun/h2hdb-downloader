name: Publish to PyPI

on:
  push:
    paths:
      - pyproject.toml

permissions:
  contents: read

jobs:
  validate:
    if: >-
      ${{ github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.version.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packaging tools
        run: python scripts/install-ci-dependencies.py packaging build

      - name: Check version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: >-
          python scripts/check-publish-version.py
          --before-revision "${BEFORE_SHA}"

      - name: Build distributions
        if: steps.version.outputs.bumped == 'true'
        run: python -m build

      - name: Smoke-test wheel
        if: steps.version.outputs.bumped == 'true'
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install --force-reinstall "$WHEEL"
          python -c "import h2hdb_downloader"

      - name: Store distributions
        if: steps.version.outputs.bumped == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: validate
    if: needs.validate.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
