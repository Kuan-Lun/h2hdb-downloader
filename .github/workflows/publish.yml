name: Publish to PyPI

on:
  push:
    paths:
      - pyproject.toml

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.version.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packaging tools
        run: python -m pip install --upgrade packaging build

      - name: Check version bump
        id: version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          from packaging.version import Version


          def project_version(document: str) -> Version:
              return Version(str(tomllib.loads(document)["project"]["version"]))


          current = project_version(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          previous_document = subprocess.run(
              ["git", "show", "HEAD~1:pyproject.toml"],
              check=False,
              capture_output=True,
              text=True,
          )
          previous = (
              project_version(previous_document.stdout)
              if previous_document.returncode == 0
              else None
          )
          if previous is not None and current < previous:
              raise SystemExit(
                  f"project.version decreased from {previous} to {current}"
              )

          bumped = previous is None or current > previous
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              print(f"current={current}", file=output)
              print(f"previous={previous or ''}", file=output)
              print(f"bumped={'true' if bumped else 'false'}", file=output)
          PY

      - name: Build distributions
        if: steps.version.outputs.bumped == 'true'
        run: python -m build

      - name: Smoke-test wheel
        if: steps.version.outputs.bumped == 'true'
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install --force-reinstall "$WHEEL"
          python -c "import h2hdb_downloader"

      - name: Store distributions
        if: steps.version.outputs.bumped == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: validate
    if: needs.validate.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
